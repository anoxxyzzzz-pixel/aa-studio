name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build APK rilis (R8, ditandatangani)
        run: gradle assembleRelease --stacktrace
      - name: Ringkasan APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk AA-Studio.apk
          ls -l AA-Studio.apk
          echo "::notice title=Ukuran APK::$(stat -c %s AA-Studio.apk) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: AA-Studio-apk
          path: AA-Studio.apk
      - name: Publikasikan sebagai GitHub Release (link unduh langsung)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest AA-Studio.apk \
            --title "AA Studio (terbaru)" \
            --notes "APK terbaru dari commit ${GITHUB_SHA::7}. Unduh AA-Studio.apk lalu pasang (izinkan sumber tidak dikenal)." \
            --latest
