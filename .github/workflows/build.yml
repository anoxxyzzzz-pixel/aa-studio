name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build APK rilis (R8, ditandatangani)
        run: gradle assembleRelease --stacktrace
      - name: Ringkasan APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk AA-Mouse-Pro.apk
          ls -l AA-Mouse-Pro.apk
          echo "::notice title=Ukuran APK::$(stat -c %s AA-Mouse-Pro.apk) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: AA-Mouse-Pro-apk
          path: AA-Mouse-Pro.apk
      - name: Publikasikan sebagai GitHub Release (link unduh langsung)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest AA-Mouse-Pro.apk \
            --title "AA Mouse Pro v1.0" \
            --notes "AA Mouse Pro v1.0 (commit ${GITHUB_SHA::7}). Baru: Web Source offline (impor .html/.zip, jalan tanpa internet, suara tetap ada). Unduh AA-Mouse-Pro.apk lalu pasang (izinkan sumber tidak dikenal). Jika Play Protect memperingatkan: ini APK pribadi yang ditandatangani kunci sendiri, bukan dari Play Store; pilih Install anyway hanya jika Anda percaya sumbernya." \
            --latest
